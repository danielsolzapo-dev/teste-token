name: Auto Farm Windows
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: token-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test servidor_ativacao/ativacao.test.mjs
      - run: python -m pip install -r requirements.txt
      - run: python leitor_replay/compilar.py
      - run: python -m py_compile app.py atualizador.py diagnostico.py embarque.py estado_local.py historico_baus.py logica_autofarm.py painel_replay.py painel_tema.py regiao.py relogio_painel.py tesouros.py texto_tela.py webhook.py windows_game.py
      - run: python preparar_ocr.py
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name AutoFarmTokenPirata --collect-all rapidocr --copy-metadata rapidocr --add-data "modelos;modelos" --add-data "templates;templates" --add-data "fontes;fontes" --add-data "leitor_replay/binario;leitor_replay/binario" app.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name EmissorLicencas emissor.py
      - run: python -m PyInstaller --noconfirm --onefile --console --name BotAtivacaoDiscord bot_discord.py
      - shell: pwsh
        run: |
          foreach ($nome in 'AutoFarmTokenPirata.exe', 'EmissorLicencas.exe', 'BotAtivacaoDiscord.exe') {
            $arquivo = Join-Path 'dist' $nome
            $smoke = Start-Process -FilePath $arquivo -ArgumentList '--verificar-build' -WindowStyle Hidden -Wait -PassThru
            if ($smoke.ExitCode -ne 0) { throw "Falha ao verificar $nome (código $($smoke.ExitCode))." }
            $hash = (Get-FileHash $arquivo -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$arquivo.sha256" -Value "$hash  $nome" -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFarmTokenPirata-Windows
          path: |
            dist/AutoFarmTokenPirata.exe
            dist/AutoFarmTokenPirata.exe.sha256
            dist/EmissorLicencas.exe
            dist/EmissorLicencas.exe.sha256
            dist/BotAtivacaoDiscord.exe
            dist/BotAtivacaoDiscord.exe.sha256
            dist/LeitorBaus-fonte.zip
      - if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = python -c "from versao import VERSAO; print(VERSAO)"
          $tag = "v$version"
          if ($env:BUILD_REF -ne 'main' -and $env:BUILD_REF -ne $tag) { throw "A tag e a versão do app precisam corresponder." }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag dist/AutoFarmTokenPirata.exe dist/AutoFarmTokenPirata.exe.sha256 dist/EmissorLicencas.exe dist/EmissorLicencas.exe.sha256 dist/BotAtivacaoDiscord.exe dist/BotAtivacaoDiscord.exe.sha256 dist/LeitorBaus-fonte.zip --target $env:GITHUB_SHA --title "Auto Farm $tag" --generate-notes
          exit $LASTEXITCODE
